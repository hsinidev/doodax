        body {

        /* Multi-colored Galaxy Background */
        .galaxy-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.25), transparent 25%), 
                radial-gradient(circle at 85% 30%, rgba(14, 165, 233, 0.25), transparent 25%), 
                radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.15), transparent 50%);
            background-color: #020617; /* Slate 950 base */
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            opacity: 0.8;
            animation: starMove 200s linear infinite;
        }
        
        .nebula {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://raw.githubusercontent.com/hsinidev/assets/main/nebula-overlay.png'); 
            /* Fallback generic noise/cloud texture if URL fails or just use CSS clouds */
            background: url(http://www.script-tutorials.com/demos/360/images/clouds3.png) repeat top center;
            opacity: 0.3;
            animation: nebulaMove 150s linear infinite;
            filter: hue-rotate(45deg);
        }

        @keyframes starMove {
            from { background-position: 0 0, 40px 60px, 130px 270px; }
            to { background-position: 550px 550px, 590px 610px, 680px 820px; }
        }

        @keyframes nebulaMove {
            from { background-position: 0 0; }
            to { background-position: 10000px 0; }
        }
        
        /* Smooth Scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Custom Scrollbar */

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050505;
      overflow-x: hidden;
      color: #e2e8f0;
    }
    
    /* Starfield Animation */
    #star-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
      overflow: hidden;
    }

    .stars {
      width: 1px;
      height: 1px;
      background: transparent;
      box-shadow: 1744px 122px #FFF , 134px 1321px #FFF , 92px 859px #FFF;
      animation: animStar 50s linear infinite;
    }
    
    .stars:after {
      content: " ";
      position: absolute;
      top: 2000px;
      width: 1px;
      height: 1px;
      background: transparent;
      box-shadow: 1744px 122px #FFF , 134px 1321px #FFF , 92px 859px #FFF;
    }

    .stars2 {
      width: 2px;
      height: 2px;
      background: transparent;
      box-shadow: 122px 1744px #FFF , 1321px 134px #FFF , 859px 92px #FFF;
      animation: animStar 100s linear infinite;
    }
    
    .stars2:after {
      content: " ";
      position: absolute;
      top: 2000px;
      width: 2px;
      height: 2px;
      background: transparent;
      box-shadow: 122px 1744px #FFF , 1321px 134px #FFF , 859px 92px #FFF;
    }

    .stars3 {
      width: 3px;
      height: 3px;
      background: transparent;
      box-shadow: 322px 144px #7c3aed , 221px 34px #4f46e5 , 59px 922px #be185d;
      animation: animStar 150s linear infinite;
    }
    
    .stars3:after {
      content: " ";
      position: absolute;
      top: 2000px;
      width: 3px;
      height: 3px;
      background: transparent;
      box-shadow: 322px 144px #7c3aed , 221px 34px #4f46e5 , 59px 922px #be185d;
    }

    @keyframes animStar {
      from { transform: translateY(0px); }
      to { transform: translateY(-2000px); }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a; 
    }
    ::-webkit-scrollbar-thumb {
      background: #4f46e5; 
      border-radius: 5px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4338ca; 
    }
  </style>

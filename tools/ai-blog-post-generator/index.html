    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #050505;
        overflow-x: hidden;
        color: #e2e8f0;
      }
      
      /* Deep Space Background */
      .galaxy-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -10;
        background: radial-gradient(ellipse at bottom, #0f172a 0%, #000000 100%);
        overflow: hidden;
      }

      /* Multi-colored Nebula Layers */
      .nebula-layer {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.4;
        animation: floatNebula 20s infinite alternate;
      }

      .nebula-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #4c1d95; animation-delay: 0s; } /* Violet */
      .nebula-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: #be185d; animation-delay: -5s; } /* Pink */
      .nebula-3 { top: 40%; left: 40%; width: 40vw; height: 40vw; background: #1e40af; animation-delay: -10s; opacity: 0.3; } /* Blue */
      .nebula-4 { bottom: 20%; left: 10%; width: 30vw; height: 30vw; background: #047857; animation-delay: -15s; opacity: 0.2; } /* Emerald */

      @keyframes floatNebula {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(30px, 50px) scale(1.1); }
      }

      /* Stars */
      .stars {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
          radial-gradient(1px 1px at 20px 30px, #eee, rgba(0,0,0,0)),
          radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
          radial-gradient(1px 1px at 50px 160px, #ddd, rgba(0,0,0,0)),
          radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
          radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0));
        background-repeat: repeat;
        background-size: 200px 200px;
        animation: twinkle 4s infinite linear;
        opacity: 0.6;
      }

      @keyframes twinkle {
        0% { opacity: 0.5; transform: translateY(0); }
        50% { opacity: 0.8; }
        100% { opacity: 0.5; transform: translateY(-20px); }
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(17, 24, 39, 0.8); 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(99, 102, 241, 0.5); 
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(99, 102, 241, 0.8); 
      }
      
      .glass-panel {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    </style>

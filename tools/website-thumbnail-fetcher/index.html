    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        overflow-x: hidden;
        font-family: 'Inter', system-ui, sans-serif;
      }
      
      /* Galaxy Background Animation */
      .galaxy-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -10;
        background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
        overflow: hidden;
      }

      .nebula-layer {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: 
          radial-gradient(circle at 50% 50%, rgba(76, 29, 149, 0.15), transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(14, 165, 233, 0.1), transparent 40%),
          radial-gradient(circle at 20% 80%, rgba(236, 72, 153, 0.1), transparent 40%);
        filter: blur(80px);
        animation: spinNebula 60s linear infinite;
        opacity: 0.6;
      }

      @keyframes spinNebula {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .stars {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      .star-layer-1 {
        background-image: 
          radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
          radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
          radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
          radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
          radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0));
        background-size: 200px 200px;
        animation: moveStars 100s linear infinite;
        opacity: 0.5;
      }

      .star-layer-2 {
        background-image: 
          radial-gradient(3px 3px at 50px 100px, #00d7ff, rgba(0,0,0,0)),
          radial-gradient(3px 3px at 100px 50px, #ff00de, rgba(0,0,0,0));
        background-size: 300px 300px;
        animation: moveStars 150s linear infinite;
        opacity: 0.3;
      }
      
      @keyframes moveStars {
        from { transform: translateY(0); }
        to { transform: translateY(-2000px); }
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(to bottom, #06b6d4, #8b5cf6);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(to bottom, #0891b2, #7c3aed);
      }

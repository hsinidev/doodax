    <style>
      :root {
        --color-bg-dark: #050505;
        --color-nebula-1: #4c1d95; /* violet-900 */
        --color-nebula-2: #be185d; /* pink-700 */
        --color-nebula-3: #1e3a8a; /* blue-900 */
      }
      
      body {
        font-family: 'Sora', sans-serif;
        background-color: var(--color-bg-dark);
        color: #ffffff;
        overflow-x: hidden;
      }

      /* Galaxy Background Animation */
      .galaxy-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        overflow: hidden;
        background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
      }

      .stars {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: url(http://www.script-tutorials.com/demos/360/images/stars.png) repeat top center;
        z-index: 0;
        opacity: 0.8;
      }

      .twinkling {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: url(http://www.script-tutorials.com/demos/360/images/twinkling.png) repeat top center;
        z-index: 1;
        animation: move-twinkling 200s linear infinite;
        opacity: 0.6;
      }

      .nebula-glow {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: 
          radial-gradient(circle at 50% 50%, rgba(76, 29, 149, 0.2), transparent 60%),
          radial-gradient(circle at 80% 20%, rgba(190, 24, 93, 0.15), transparent 40%),
          radial-gradient(circle at 20% 80%, rgba(30, 58, 138, 0.2), transparent 40%);
        filter: blur(40px);
        z-index: 2;
        animation: pulse-nebula 10s ease-in-out infinite alternate;
      }

      @keyframes move-twinkling {
        from {background-position:0 0;}
        to {background-position:-10000px 5000px;}
      }

      @keyframes pulse-nebula {
        0% { opacity: 0.5; transform: scale(1); }
        100% { opacity: 0.8; transform: scale(1.1); }
      }
    </style>

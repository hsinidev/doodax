    <style>
        /* Enhanced Cosmic Background */
        body {
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
        }

        #galaxy-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -10;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            overflow: hidden;
        }

        .stars {
            width: 1px;
            height: 1px;
            background: transparent;
            box-shadow: 1744px 122px #FFF , 134px 1321px #FFF , 92px 859px #FFF;
            animation: animStar 50s linear infinite;
        }
        
        .stars:after {
            content: " ";
            position: absolute;
            top: 2000px;
            width: 1px;
            height: 1px;
            background: transparent;
            box-shadow: 1744px 122px #FFF , 134px 1321px #FFF , 92px 859px #FFF;
        }

        .stars2 {
            width: 2px;
            height: 2px;
            background: transparent;
            box-shadow: 800px 500px #FFF , 1200px 300px #FFF , 400px 800px #FFF;
            animation: animStar 100s linear infinite;
        }
        
        .stars2:after {
            content: " ";
            position: absolute;
            top: 2000px;
            width: 2px;
            height: 2px;
            background: transparent;
            box-shadow: 800px 500px #FFF , 1200px 300px #FFF , 400px 800px #FFF;
        }

        .nebula {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(76, 29, 149, 0.4), transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.3), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.2), transparent 50%);
            filter: blur(60px);
            animation: nebulaPulse 10s ease-in-out infinite alternate;
        }

        @keyframes animStar {
            from { transform: translateY(0px); }
            to { transform: translateY(-2000px); }
        }

        @keyframes nebulaPulse {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        /* Layout & Utilities */
        .content-wrapper {
            position: relative;
            z-index: 1;
        }
        
        .bg-light-card { 
            background-color: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(10px);
        }
        
        .btn-primary { 
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white; 
            transition: all 0.3s ease; 
            box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.39);
        }
        .btn-primary:hover { 
            transform: translateY(-1px);
            box-shadow: 0 6px 20px 0 rgba(37, 99, 235, 0.23);
        }

        .text-gold { color: #FFD700; }
        
        /* Article Truncation */
        .article-preview {
            position: relative;
            max-height: 4.5em; /* Approx 3 lines */
            overflow: hidden;
            transition: max-height 0.8s ease-in-out;
        }
        .article-preview.expanded {
            max-height: 20000px;
            overflow: visible;
        }
        .article-preview::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3em;
            background: linear-gradient(to bottom, transparent, white);
            transition: opacity 0.3s;
        }
        .article-preview.expanded::after {
            opacity: 0;
            pointer-events: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
    </style>

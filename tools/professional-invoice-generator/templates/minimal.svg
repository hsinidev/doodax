<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" fill="none">
    <rect width="210" height="297" fill="#ffffff"/>
    
    <!-- Header: Just text -->
    <text x="20" y="30" font-family="sans-serif" font-weight="bold" font-size="20" fill="#000">INVOICE</text>
    <rect x="20" y="40" width="20" height="2" fill="#000"/>
    
    <!-- Info grid -->
    <rect x="20" y="60" width="50" height="4" rx="1" fill="#333"/>
    <rect x="20" y="68" width="70" height="3" rx="1" fill="#777"/>
    
    <rect x="140" y="60" width="50" height="4" rx="1" fill="#333"/>
    <rect x="140" y="68" width="40" height="3" rx="1" fill="#777"/>

    <!-- Table: Minimal lines -->
    <rect x="20" y="100" width="170" height="1" fill="#000"/>
    
    <rect x="20" y="115" width="100" height="4" rx="1" fill="#333"/>
    <rect x="170" y="115" width="20" height="4" rx="1" fill="#333"/>
    <rect x="20" y="125" width="170" height="1" fill="#eee"/>
    
    <rect x="20" y="135" width="80" height="4" rx="1" fill="#333"/>
    <rect x="170" y="135" width="20" height="4" rx="1" fill="#333"/>
    <rect x="20" y="145" width="170" height="1" fill="#eee"/>

    <!-- Total -->
    <rect x="120" y="170" width="70" height="1" fill="#000"/>
    <rect x="120" y="180" width="30" height="4" fill="#333"/>
    <rect x="160" y="178" width="30" height="8" fill="#000"/>
</svg>
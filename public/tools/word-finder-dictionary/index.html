      /* IMMERSIVE GALAXY BACKGROUND */
      .galaxy-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);

      }

      .stars {
        width: 1px;
        height: 1px;
        background: transparent;
        box-shadow: 1744px 122px #FFF , 134px 1321px #FFF , 92px 859px #FFF; /* Simplified for brevity, usually huge list */
        animation: animStar 50s linear infinite;
      }
      
      .stars:after {
        content: " ";
        position: absolute;
        top: 2000px;
        width: 1px;
        height: 1px;
        background: transparent;
        box-shadow: 1744px 122px #FFF , 134px 1321px #FFF , 92px 859px #FFF;
      }

      .nebula {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: 
            radial-gradient(circle at 50% 50%, rgba(76, 29, 149, 0.1), transparent 60%),
            radial-gradient(circle at 80% 20%, rgba(56, 189, 248, 0.05), transparent 40%),
            radial-gradient(circle at 20% 80%, rgba(236, 72, 153, 0.05), transparent 40%);
        filter: blur(60px);
        animation: pulse 15s ease-in-out infinite alternate;
      }

      @keyframes animStar {
        from { transform: translateY(0px); }
        to { transform: translateY(-2000px); }
      }

      @keyframes pulse {
        0% { opacity: 0.5; transform: scale(1); }
        100% { opacity: 0.8; transform: scale(1.1); }
      }

      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .animate-fade-in-up {
        animation: fade-in-up 0.4s ease-out forwards;
      }

      .animate-fade-in {
          animation: fadeIn 0.5s ease-out;
      }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>

    <!-- Generate Stars via JS to keep HTML clean and performant -->
    <script>
        function createStars(n, size, duration) {
            const stars = document.createElement('div');
            let boxShadow = '';
            for(let i=0; i<n; i++) {
                boxShadow += `${Math.random()*2000}px ${Math.random()*2000}px #FFF, `;
            }
            boxShadow = boxShadow.slice(0, -2);
            
            stars.style.width = size + 'px';
            stars.style.height = size + 'px';
            stars.style.background = 'transparent';
            stars.style.boxShadow = boxShadow;
            stars.style.animation = `animStar ${duration}s linear infinite`;
            stars.style.position = 'absolute';
            
            // Create pseudo element logic via pure CSS injection or simple duplication
            // For simplicity in this script, we just append to body container
            return stars;
        }
        
        const container = document.querySelector('.galaxy-container');
        const smallStars = createStars(700, 1, 50);
        const mediumStars = createStars(200, 2, 100);
        const bigStars = createStars(100, 3, 150);
        
        container.appendChild(smallStars);
        container.appendChild(mediumStars);
        container.appendChild(bigStars);
    </script>

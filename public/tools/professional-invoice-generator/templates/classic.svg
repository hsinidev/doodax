<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" fill="none">
    <rect width="210" height="297" fill="white"/>
    <!-- Header -->
    <rect x="20" y="20" width="80" height="15" rx="2" fill="#333"/>
    <rect x="20" y="40" width="60" height="4" rx="1" fill="#999"/>
    <rect x="130" y="20" width="60" height="8" rx="1" fill="#333"/>
    <rect x="130" y="32" width="60" height="4" rx="1" fill="#999"/>
    
    <!-- Divider -->
    <line x1="20" y1="60" x2="190" y2="60" stroke="#ddd" stroke-width="1"/>
    
    <!-- Bill To -->
    <rect x="20" y="75" width="40" height="6" rx="1" fill="#555"/>
    <rect x="20" y="85" width="70" height="4" rx="1" fill="#999"/>
    <rect x="20" y="92" width="60" height="4" rx="1" fill="#999"/>

    <!-- Table Header -->
    <rect x="20" y="110" width="170" height="10" fill="#f3f4f6"/>
    
    <!-- Table Rows -->
    <rect x="20" y="125" width="170" height="1" fill="#eee"/>
    <rect x="25" y="130" width="80" height="4" rx="1" fill="#777"/>
    <rect x="170" y="130" width="15" height="4" rx="1" fill="#777"/>
    
    <rect x="20" y="140" width="170" height="1" fill="#eee"/>
    <rect x="25" y="145" width="60" height="4" rx="1" fill="#777"/>
    <rect x="170" y="145" width="15" height="4" rx="1" fill="#777"/>
    
    <rect x="20" y="155" width="170" height="1" fill="#eee"/>
    
    <!-- Totals -->
    <rect x="140" y="170" width="50" height="1" fill="#ddd"/>
    <rect x="140" y="175" width="20" height="4" rx="1" fill="#999"/>
    <rect x="170" y="175" width="20" height="4" rx="1" fill="#333"/>
    
    <rect x="140" y="185" width="20" height="4" rx="1" fill="#999"/>
    <rect x="170" y="185" width="20" height="4" rx="1" fill="#333"/>
    
    <!-- Footer -->
    <rect x="20" y="270" width="170" height="1" fill="#eee"/>
    <rect x="75" y="275" width="60" height="3" rx="1" fill="#ccc"/>
</svg>
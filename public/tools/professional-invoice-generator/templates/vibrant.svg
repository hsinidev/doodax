<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" fill="none">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="210" height="297" fill="white"/>
    
    <!-- Gradient Header -->
    <rect x="0" y="0" width="210" height="50" fill="url(#grad1)"/>
    <text x="20" y="32" font-family="sans-serif" font-weight="bold" font-size="16" fill="white">INVOICE</text>
    
    <!-- Body -->
    <rect x="20" y="70" width="60" height="5" rx="1" fill="#333"/>
    <rect x="20" y="80" width="80" height="3" rx="1" fill="#888"/>
    
    <!-- Table Header with gradient accent -->
    <rect x="20" y="110" width="170" height="8" rx="2" fill="url(#grad1)" opacity="0.1"/>
    <rect x="20" y="110" width="170" height="8" rx="2" stroke="url(#grad1)" stroke-width="0.5"/>
    
    <!-- Rows -->
    <rect x="25" y="130" width="100" height="3" rx="1" fill="#444"/>
    <rect x="170" y="130" width="15" height="3" rx="1" fill="#444"/>
    
    <rect x="25" y="145" width="80" height="3" rx="1" fill="#444"/>
    <rect x="170" y="145" width="15" height="3" rx="1" fill="#444"/>
    
    <!-- Total -->
    <rect x="140" y="180" width="50" height="15" rx="2" fill="url(#grad1)"/>
    <text x="150" y="191" font-family="sans-serif" font-weight="bold" font-size="8" fill="white">TOTAL</text>
</svg>